name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r services/sample-api/requirements.txt -r services/ai-sre-agent/requirements.txt pytest
      - run: pytest -q
      - run: python -m compileall -q services
