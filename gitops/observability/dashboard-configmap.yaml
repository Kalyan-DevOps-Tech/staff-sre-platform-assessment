apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-api-dashboard
  labels:
    grafana_dashboard: "1"
data:
  sample-api.json: |
    {
      "title": "Sample API SRE Overview",
      "uid": "sample-api-sre",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {"id":1,"type":"timeseries","title":"Request rate","gridPos":{"h":8,"w":12,"x":0,"y":0},"targets":[{"expr":"sum(rate(http_server_requests_total{namespace=\"apps\"}[5m]))","refId":"A"}]},
        {"id":2,"type":"timeseries","title":"5xx rate","gridPos":{"h":8,"w":12,"x":12,"y":0},"targets":[{"expr":"sum(rate(http_server_requests_total{namespace=\"apps\",status_code=~\"5..\"}[5m]))","refId":"A"}]},
        {"id":3,"type":"timeseries","title":"p95 latency (seconds)","gridPos":{"h":8,"w":12,"x":0,"y":8},"targets":[{"expr":"histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{namespace=\"apps\"}[5m])))","refId":"A"}]},
        {"id":4,"type":"timeseries","title":"Successful request ratio","gridPos":{"h":8,"w":12,"x":12,"y":8},"targets":[{"expr":"sum(rate(http_server_requests_total{namespace=\"apps\",status_code!~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_total{namespace=\"apps\"}[5m])), 0.001)","refId":"A"}]}
      ]
    }
