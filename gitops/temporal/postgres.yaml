apiVersion: v1
kind: Service
metadata: { name: temporal-postgres }
spec:
  selector: { app: temporal-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: temporal-postgres }
spec:
  serviceName: temporal-postgres
  replicas: 1
  selector: { matchLabels: { app: temporal-postgres } }
  template:
    metadata: { labels: { app: temporal-postgres } }
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 999 }
      containers:
        - name: postgres
          image: postgres:16.6-alpine
          env:
            - { name: POSTGRES_DB, value: temporal }
            - { name: POSTGRES_USER, value: temporal }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: temporal-db, key: password } } }
          ports: [{ containerPort: 5432 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { exec: { command: [sh, -c, 'pg_isready -U temporal -d temporal'] }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: { exec: { command: [sh, -c, 'pg_isready -U temporal -d temporal'] }, initialDelaySeconds: 20, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 2Gi } }
