apiVersion: v1
kind: Service
metadata: { name: temporal-frontend }
spec:
  selector: { app: temporal }
  ports: [{ name: grpc, port: 7233, targetPort: 7233 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: temporal }
spec:
  replicas: 1
  selector: { matchLabels: { app: temporal } }
  template:
    metadata: { labels: { app: temporal } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.26.2
          env:
            - { name: DB, value: postgres12 }
            - { name: DB_PORT, value: "5432" }
            - { name: POSTGRES_SEEDS, value: temporal-postgres.platform.svc.cluster.local }
            - { name: POSTGRES_USER, value: temporal }
            - { name: POSTGRES_PWD, valueFrom: { secretKeyRef: { name: temporal-db, key: password } } }
            - { name: DYNAMIC_CONFIG_FILE_PATH, value: config/dynamicconfig/development.yaml }
          ports: [{ containerPort: 7233 }]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          readinessProbe: { tcpSocket: { port: 7233 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 7233 }, initialDelaySeconds: 60, periodSeconds: 20 }
