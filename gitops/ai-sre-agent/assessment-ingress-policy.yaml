apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-sre-agent-assessment-ingress
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-sre-agent
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sample-api-assessment
      ports:
        - protocol: TCP
          port: 8081
