apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-sre-agent
  labels: { app.kubernetes.io/name: ai-sre-agent }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ai-sre-agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ai-sre-agent }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: agent
          image: ghcr.io/kalyan-devops-tech/ai-sre-agent:0.1.3@sha256:1410e6abbcb5492e9cf09d401c7f595470c0061bda0380a97909b9ba4b1b3644 # Build/publish and pin digest before deployment
          ports: [{ name: http, containerPort: 8081 }]
          env:
            - { name: PROMETHEUS_URL, value: http://platform-kube-prometheus-s-prometheus.observability.svc.cluster.local:9090 }
            - { name: LOKI_URL, value: http://loki.observability.svc.cluster.local:3100 }
            - { name: TEMPO_URL, value: http://tempo.observability.svc.cluster.local:3100 }
            - { name: OPENAI_MODEL, value: gpt-4.1-mini }
            - { name: OPENAI_API_KEY, valueFrom: { secretKeyRef: { name: ai-sre-agent-secrets, key: openai-api-key, optional: true } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 5, periodSeconds: 15 }
