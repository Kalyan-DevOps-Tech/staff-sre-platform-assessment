apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  labels: { app.kubernetes.io/name: sample-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sample-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sample-api }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/kalyan-devops-tech/sample-api:0.1.0 # Build/publish this image and pin digest before deployment
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: OTEL_SERVICE_NAME, value: sample-api }
            - { name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: http://tempo.observability.svc.cluster.local:4318/v1/traces }
            - { name: FAULT_INJECTION_ENABLED, value: "false" }
            - { name: FAULT_INJECTION_TOKEN, valueFrom: { secretKeyRef: { name: sample-api-fault-token, key: token, optional: true } } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 3, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 5, periodSeconds: 15 }
          startupProbe: { httpGet: { path: /health/live, port: http }, failureThreshold: 20, periodSeconds: 3 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 32Mi } }]
