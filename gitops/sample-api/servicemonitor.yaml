apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sample-api
  labels:
    release: platform
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: sample-api }
  namespaceSelector:
    matchNames: [apps]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
