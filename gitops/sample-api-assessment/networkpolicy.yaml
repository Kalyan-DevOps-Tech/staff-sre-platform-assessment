apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sample-api-assessment
  namespace: apps
  labels:
    app.kubernetes.io/name: sample-api-assessment
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sample-api-assessment
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: apps
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - protocol: TCP
      port: 9090
    - protocol: TCP
      port: 3100
    - protocol: TCP
      port: 3200
    - protocol: TCP
      port: 4318
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: apps
      podSelector:
        matchLabels:
          app.kubernetes.io/name: ai-sre-agent
    ports:
    - protocol: TCP
      port: 8081
