apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api-assessment
  namespace: apps
  labels:
    app.kubernetes.io/name: sample-api-assessment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-api-assessment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-api-assessment
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kalyan-devops-tech/sample-api@sha256:d3b1a47035b21d56c8296c27c86a9408549787681dccd7f85d70ce91e8598ca9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: sample-api-assessment
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://tempo.observability.svc.cluster.local:4318/v1/traces
            - name: FAULT_INJECTION_ENABLED
              value: "true"
            - name: FAULT_INJECTION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sample-api-fault-token
                  key: token
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
