apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sample-api-assessment
  namespace: apps
  labels:
    release: platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-api-assessment
  namespaceSelector:
    matchNames:
      - apps
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
