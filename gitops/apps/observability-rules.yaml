apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-rules
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kalyan-DevOps-Tech/staff-sre-platform-assessment.git # UPDATE if repository differs
    targetRevision: main
    path: gitops/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions: [CreateNamespace=true]
