apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kalyan-DevOps-Tech/staff-sre-platform-assessment.git # UPDATE if repository differs
    targetRevision: main
    path: gitops/sample-api
  destination:
    server: https://kubernetes.default.svc
    namespace: apps
  syncPolicy:
    automated: { selfHeal: true, prune: true }
    syncOptions: [CreateNamespace=true]
---
